<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>LiveChat</title>
  <meta name="description" content="Professional real-time chat application with iconic Apple liquid glassmorphism, live keystroke streaming, and secure passcode lock.">
  <link rel="stylesheet" href="style.css?v=10.1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Desktop Ambient Wallpaper Lights -->
  <div class="desktop-wallpaper-glow desktop-wallpaper-glow--1" aria-hidden="true"></div>
  <div class="desktop-wallpaper-glow desktop-wallpaper-glow--2" aria-hidden="true"></div>
  <div class="desktop-wallpaper-glow desktop-wallpaper-glow--3" aria-hidden="true"></div>

  <!-- Main Liquid Glass Chat App Container -->
  <div class="chat-app" id="chatApp">
    
    <!-- Liquid Glass Specular Inner Rim Layer -->
    <div class="liquid-glass-rim" aria-hidden="true"></div>

    <!-- Background Subtle Prismatic Lines -->
    <div class="background-watermark" aria-hidden="true">
      <svg viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M-60 140 C 140 100, 260 300, 460 220" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2" stroke-dasharray="4 6"/>
        <path d="M-40 460 C 120 540, 280 390, 480 620" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.2"/>
        <path d="M120 -60 C 200 190, 60 440, 250 860" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>
      </svg>
    </div>

    <!-- Chats List Screen (Shown after PIN unlock) -->
    <div class="chats-screen" id="chatsScreen">
      <!-- Apple Liquid Glass Header for Chats -->
      <header class="chats-screen-header">
        <div class="chats-header-left">
          <div class="chats-user-avatar-wrap" id="chatsUserAvatarWrap" title="Your Profile">
            <img id="chatsUserAvatar" class="chats-user-avatar" src="" alt="My Profile">
            <span class="chats-user-badge"></span>
          </div>
          <div class="chats-title-group">
            <h1 class="chats-header-title">Chats</h1>
            <span class="chats-user-subtitle" id="chatsUserSubtitle">Logged in</span>
          </div>
        </div>

        <div class="header-actions-capsule">
          <!-- Sound Toggle -->
          <button class="action-icon-btn" id="chatsSoundToggleBtn" aria-label="Toggle typing sound" title="Typing sound enabled (Click to mute)">
            <svg class="sound-on-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg class="sound-off-icon" style="display: none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>

          <div class="header-action-divider" aria-hidden="true"></div>

          <!-- Lock App -->
          <button class="action-icon-btn" id="chatsLockAppBtn" aria-label="Lock App / Switch User" title="Lock App">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="3" ry="3"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </button>

          <div class="header-action-divider" aria-hidden="true"></div>

          <!-- Subtle Link to LiveDraw -->
          <a href="https://livedrawing.onrender.com/" target="_blank" rel="noopener noreferrer" class="tiny-external-btn" id="chatsLiveDrawingBtn" aria-label="Open LiveDraw" title="LiveDraw">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </a>
        </div>
      </header>

      <!-- Glassmorphic Search Bar -->
      <div class="chats-search-bar-wrap">
        <div class="chats-search-pill">
          <svg class="chats-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="chatsSearchInput" class="chats-search-input" placeholder="Search chats or messages..." autocomplete="off">
          <button type="button" id="chatsSearchClearBtn" class="chats-search-clear" aria-label="Clear Search" style="display: none;">&times;</button>
        </div>
      </div>

      <!-- Scrollable Conversations List -->
      <div class="chats-scroll-body">
        <div class="chats-section-header">
          <span>Direct Messages</span>
          <span class="chats-count-badge" id="chatsCountBadge">1</span>
        </div>

        <div class="chats-list" id="chatsListContainer">
          <!-- Chat cards dynamically rendered by app.js -->
        </div>

        <div class="chats-empty-state" id="chatsEmptyState" style="display: none;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <p>No conversations found</p>
        </div>
      </div>
    </div>

    <!-- Active Conversation Screen -->
    <div class="conversation-screen" id="conversationScreen">
      <!-- Apple Iconic Liquid Glass Header Navigation -->
      <header class="chat-header" aria-label="Conversation Header">
        <div class="header-left">
          <!-- Back to Chats Button -->
          <button class="chat-back-btn" id="chatBackBtn" aria-label="Back to chats" title="Back to chats">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span class="back-text">Chats</span>
          </button>

          <!-- Avatar with Specular Liquid Glass Ring -->
          <div class="avatar-wrapper" id="avatarWrapper" title="Click to close keyboard">
            <div class="avatar-glass-halo" aria-hidden="true"></div>
            <img id="avatarImg" class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=256" alt="User Avatar">
            <span class="avatar-badge" id="avatarBadge" aria-label="Online Indicator">
              <span class="avatar-badge-core"></span>
            </span>
          </div>

          <!-- User Info with Status Capsule -->
          <div class="user-info">
            <h1 class="user-name" id="userName">User</h1>
            <div class="user-status-capsule">
              <span class="user-status" id="userStatus">Connecting...</span>
            </div>
          </div>
        </div>

        <!-- Segmented Liquid Glass Header Action Capsule -->
        <div class="header-actions-capsule">
          <!-- Sound Toggle -->
          <button class="action-icon-btn" id="soundToggleBtn" aria-label="Toggle typing sound" title="Typing sound enabled (Click to mute)">
            <!-- Sound ON Icon -->
            <svg class="sound-on-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <!-- Sound OFF Icon -->
            <svg class="sound-off-icon" style="display: none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>

          <div class="header-action-divider" aria-hidden="true"></div>

          <!-- Clear Chat History -->
          <button class="action-icon-btn" id="clearChatBtn" aria-label="Clear Chat History" title="Clear Chat">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>

          <div class="header-action-divider" aria-hidden="true"></div>

          <!-- Lock App / Switch User -->
          <button class="action-icon-btn" id="lockAppBtn" aria-label="Lock App / Switch User" title="Lock App">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="3" ry="3"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </button>

          <div class="header-action-divider" aria-hidden="true"></div>

          <!-- Subtle Link to LiveDraw -->
          <a href="https://livedrawing.onrender.com/" target="_blank" rel="noopener noreferrer" class="tiny-external-btn" id="liveDrawingBtn" aria-label="Open LiveDraw" title="LiveDraw">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </a>
        </div>
      </header>

      <!-- Chat Messages Scroll Container -->
      <main class="chat-body" id="chatMessages" role="log" aria-live="polite">
        
        <!-- Date Divider -->
        <div class="date-divider" id="chatDateDivider">Today</div>

        <!-- Live Typing Indicator for Opponent User -->
        <div class="typing-indicator" id="typingIndicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>

        <!-- Scroll anchor to ensure newest messages stay above input bar -->
        <div id="chatBottomAnchor" class="chat-bottom-anchor" aria-hidden="true"></div>

      </main>

      <!-- Bottom Liquid Glass Input Bar -->
      <footer class="chat-footer" id="chatFooter">
        <!-- Reply Preview Bar (Swipe right to reply to opponent) -->
        <div class="reply-preview-bar" id="replyPreviewBar" style="display: none;">
          <div class="reply-preview-accent"></div>
          <div class="reply-preview-content">
            <div class="reply-preview-header">
              <svg class="reply-preview-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 17 4 12 9 7"></polyline>
                <path d="M20 18v-2a4 4 0 0 0-4-4H4"></path>
              </svg>
              <span class="reply-preview-title" id="replyPreviewTitle">Replying to Jenu</span>
            </div>
            <div class="reply-preview-text" id="replyPreviewText">Message preview</div>
          </div>
          <div class="reply-preview-thumb-wrapper" id="replyPreviewThumbWrapper" style="display: none;">
            <img id="replyPreviewThumb" src="" alt="Photo preview">
          </div>
          <button class="reply-preview-close-btn" id="replyPreviewCloseBtn" type="button" aria-label="Cancel reply" title="Cancel reply">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="input-container">
          
          <!-- Liquid Glass Input Pill -->
          <div class="input-pill" id="inputPill">
            <div class="input-normal-content" id="inputNormalContent">
              <!-- Emoji Picker Trigger -->
              <button class="input-icon-btn" id="emojiBtn" aria-label="Insert Emoji" type="button" title="Insert Emoji">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                  <line x1="9" y1="9" x2="9.01" y2="9"></line>
                  <line x1="15" y1="9" x2="15.01" y2="9"></line>
                </svg>
              </button>

              <!-- Input Text Field -->
              <input type="text" id="chatInput" class="chat-input" placeholder="iMessage" autocomplete="off" enterkeyhint="send">
              <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
            </div>

            <!-- Live Recording State Inside Pill -->
            <div class="input-recording-content" id="inputRecordingContent" style="display: none;">
              <div class="recording-badge">
                <span class="recording-pulse-dot"></span>
                <span class="recording-timer" id="recordingTimer">0:00</span>
              </div>
              <div class="recording-live-waveform">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
              </div>
              <button class="cancel-record-btn" id="cancelRecordBtn" type="button" aria-label="Cancel Voice Recording" title="Cancel">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Action Button (Mic by default, Send when typing) -->
          <button class="send-btn mic-mode" id="actionBtn" aria-label="Record voice message" type="button" title="Record Voice">
            <span id="actionIcon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
              </svg>
            </span>
          </button>

        </div>
      </footer>
    </div>

    <!-- Floating Balloon Emoji Reactions Overlay -->
    <div class="floating-balloons-container" id="floatingBalloonsContainer"></div>

    <!-- Liquid Glass Emoji Popover -->
    <div class="emoji-popover" id="emojiPopover">
      <div class="emoji-popover-actions">
        <button class="emoji-popover-action-btn" id="emojiImageBtn" type="button" title="Send Photo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span>Share Photo</span>
        </button>
      </div>
      <div class="emoji-grid">
        <button class="emoji-btn" title="Kiss (chumu, kiss)" data-emoji="💋" data-keywords="chumu, chumma, kiss, muah, seduce, attraction">💋</button>
        <button class="emoji-btn" title="Biting Lip (kamor, biting)" data-emoji="🫦" data-keywords="thot, kamor, biting, nibble, tempting, desire">🫦</button>
        <button class="emoji-btn" title="Blow Kiss (chumu, kiss)" data-emoji="😘" data-keywords="chumu, chumma, kiss, muah, romance, seduce">😘</button>
        <button class="emoji-btn" title="In Love (bhalobasha, prem)" data-emoji="🥰" data-keywords="bhalobasha, prem, valobashi, valobasi, bhalobasi, adore, intimacy, affection, love">🥰</button>
        <button class="emoji-btn" title="Heart Eyes (sundor, gorgeous)" data-emoji="😍" data-keywords="sundor, shundor, mugdho, gorgeous, attraction, desire, beautiful">😍</button>
        <button class="emoji-btn" title="Heart on Fire (agun, passion)" data-emoji="❤️‍🔥" data-keywords="agun, prem, passion, desire, lust, intimacy">❤️‍🔥</button>
        <button class="emoji-btn" title="Hot (gorom, sexy, spicy)" data-emoji="🥵" data-keywords="gorom, hot, sexy, spicy, horny, aroused">🥵</button>
        <button class="emoji-btn" title="Flirty Smirk (dushtu, flirty)" data-emoji="😏" data-keywords="dushtu, dushtumi, flirty, naughty, tease, suggestive">😏</button>
        <button class="emoji-btn" title="Drool (khide, yummy)" data-emoji="🤤" data-keywords="lobh, khide, yummy, tasty, tempting, craving">🤤</button>
        <button class="emoji-btn" title="Wink (ishara, wink)" data-emoji="😉" data-keywords="ishara, wink, dushtu, hehe, flirt, tease">😉</button>
        <button class="emoji-btn" title="Tease (jib, lick)" data-emoji="👅" data-keywords="jib, vengchi, tease, lick, playful, naughty">👅</button>
        <button class="emoji-btn" title="Fire (agun, joss)" data-emoji="🔥" data-keywords="agun, joss, darun, fire, passion, desire">🔥</button>
        <button class="emoji-btn" title="Red Heart (mon, prem)" data-emoji="❤️" data-keywords="bhalobasha, valobashi, valobasi, mon, prem, affection, intimacy">❤️</button>
        <button class="emoji-btn" title="Sparkling Heart (mishti, maya)" data-emoji="💖" data-keywords="mishti, jhikimiki, maya, sparkle, affection, romance">💖</button>
        <button class="emoji-btn" title="Two Hearts (dujon, couple)" data-emoji="💕" data-keywords="dujon, juti, prem, couple, romance, intimacy">💕</button>
        <button class="emoji-btn" title="Cupid Heart (crush, monchuri)" data-emoji="💘" data-keywords="cupid, crush, prem, monchuri, attraction, desire">💘</button>
        <button class="emoji-btn" title="Beating Heart (heartbeat)" data-emoji="💓" data-keywords="dhorfor, heartbeat, kapche, uttejona, excitement, passion">💓</button>
        <button class="emoji-btn" title="Embrace (joriye, hug)" data-emoji="🫂" data-keywords="joriye, hug, ador, cuddle, intimacy, closeness">🫂</button>
        <button class="emoji-btn" title="Red Rose (golap, rose)" data-emoji="🌹" data-keywords="golap, ful, romance, seduction, attraction, desire, rose">🌹</button>
        <button class="emoji-btn" title="Wine (wine, cheers)" data-emoji="🍷" data-keywords="wine, cheers, drink, party, romance, date">🍷</button>
        <button class="emoji-btn" title="Strawberry (strawberry)" data-emoji="🍓" data-keywords="strawberry, strobari, fol, mishti, juicy, tempting">🍓</button>
        <button class="emoji-btn" title="Chocolate (choklet)" data-emoji="🍫" data-keywords="chocolate, choklet, choco, mishti, sweet, craving">🍫</button>
        <button class="emoji-btn" title="Pleading (please, maf)" data-emoji="🥺" data-keywords="please, plz, daya, maf, maaf, affection, needy">🥺</button>
        <button class="emoji-btn" title="Sparkles (jhikimiki, magic)" data-emoji="✨" data-keywords="jhikimiki, jholmole, chokchoke, sparkle, magic, sensual">✨</button>
      </div>
    </div>

    <!-- Apple Passcode Lock Screen Overlay (Clean, Minimalist, No Names Mentioned) -->
    <div class="pin-overlay" id="pinOverlay">
      <div class="pin-card">
        <div class="pin-header">
          <div class="pin-lock-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="3" ry="3"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h2 class="pin-title">Enter Passcode</h2>
          <p class="pin-subtitle">Enter your 4-digit passcode</p>
        </div>

        <!-- 4 PIN Dots Indicator -->
        <div class="pin-dots" id="pinDots">
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>

        <div class="pin-feedback" id="pinFeedback"></div>

        <!-- Apple Liquid Glass Numeric Keypad with Subtitles -->
        <div class="pin-keypad">
          <button type="button" class="pin-key" data-digit="1">
            <span class="pin-num">1</span>
          </button>
          <button type="button" class="pin-key" data-digit="2">
            <span class="pin-num">2</span>
            <span class="pin-letters">ABC</span>
          </button>
          <button type="button" class="pin-key" data-digit="3">
            <span class="pin-num">3</span>
            <span class="pin-letters">DEF</span>
          </button>
          <button type="button" class="pin-key" data-digit="4">
            <span class="pin-num">4</span>
            <span class="pin-letters">GHI</span>
          </button>
          <button type="button" class="pin-key" data-digit="5">
            <span class="pin-num">5</span>
            <span class="pin-letters">JKL</span>
          </button>
          <button type="button" class="pin-key" data-digit="6">
            <span class="pin-num">6</span>
            <span class="pin-letters">MNO</span>
          </button>
          <button type="button" class="pin-key" data-digit="7">
            <span class="pin-num">7</span>
            <span class="pin-letters">PQRS</span>
          </button>
          <button type="button" class="pin-key" data-digit="8">
            <span class="pin-num">8</span>
            <span class="pin-letters">TUV</span>
          </button>
          <button type="button" class="pin-key" data-digit="9">
            <span class="pin-num">9</span>
            <span class="pin-letters">WXYZ</span>
          </button>
          <div class="pin-key-empty"></div>
          <button type="button" class="pin-key" data-digit="0">
            <span class="pin-num">0</span>
          </button>
          <button type="button" class="pin-key pin-back-key" id="pinBackspaceBtn" aria-label="Delete">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2z"></path>
              <line x1="18" y1="9" x2="12" y2="15"></line>
              <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <div class="image-lightbox" id="imageLightbox" style="display: none;" aria-hidden="true">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <button class="lightbox-close-btn" id="lightboxCloseBtn" type="button" aria-label="Close image preview">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="lightbox-content">
      <img id="lightboxImage" class="lightbox-img" src="" alt="Fullscreen Image Preview">
    </div>
  </div>
