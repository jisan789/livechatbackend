services:
  - type: web
    name: livechatbackend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PHP_STORAGE_URL
        value: https://cdn.jisanfx.top/chatdatabase/reciever.php
